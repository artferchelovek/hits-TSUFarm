<svg width="96" height="128" viewBox="0 0 96 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- CHIMNEY (sticks above footprint, top 1/4 of sprite = above tiles) -->
  <rect x="16" y="0" width="14" height="40" fill="#A09080"/>
  <rect x="14" y="0" width="18" height="6" fill="#808070"/>
  <rect x="18" y="0" width="10" height="6" fill="#605850"/>
  <!-- smoke -->
  <rect x="19" y="0" width="7" height="3" fill="#C8C0B8"/>

  <!-- ROOF -->
  <!-- back edge (dark — facing away) -->
  <rect x="0" y="32" width="96" height="10" fill="#346018"/>
  <!-- ridge highlight (lit peak) -->
  <rect x="0" y="42" width="96" height="5" fill="#8EC444"/>
  <!-- main roof surface -->
  <rect x="0" y="47" width="96" height="40" fill="#6A9430"/>
  <!-- shingle lines -->
  <rect x="0" y="55" width="96" height="2" fill="#527820"/>
  <rect x="0" y="65" width="96" height="2" fill="#527820"/>
  <rect x="0" y="75" width="96" height="2" fill="#527820"/>
  <!-- eave (front edge, closest to viewer = brightest) -->
  <rect x="0" y="87" width="96" height="5" fill="#82B840"/>
  <!-- eave shadow cast on wall -->
  <rect x="0" y="92" width="96" height="8" fill="#14280A"/>

  <!-- FRONT WALL -->
  <rect x="0" y="100" width="96" height="20" fill="#E4D4A4"/>
  <!-- left window -->
  <rect x="6" y="102" width="22" height="13" fill="#A8D0E0"/>
  <rect x="16" y="102" width="2" height="13" fill="#5A3010"/>
  <rect x="6" y="108" width="22" height="2" fill="#5A3010"/>
  <!-- flower box -->
  <rect x="6" y="114" width="22" height="3" fill="#7A4A18"/>
  <rect x="8"  y="111" width="5" height="4" fill="#E04848"/>
  <rect x="15" y="111" width="5" height="4" fill="#E0C030"/>
  <!-- door -->
  <rect x="37" y="103" width="22" height="17" fill="#7A4A18"/>
  <rect x="38" y="104" width="9"  height="11" fill="#9A6030"/>
  <rect x="49" y="104" width="9"  height="11" fill="#9A6030"/>
  <rect x="44" y="110" width="4"  height="3"  fill="#C08040"/>
  <!-- right window -->
  <rect x="68" y="102" width="22" height="13" fill="#A8D0E0"/>
  <rect x="78" y="102" width="2"  height="13" fill="#5A3010"/>
  <rect x="68" y="108" width="22" height="2"  fill="#5A3010"/>
  <!-- flower box -->
  <rect x="68" y="114" width="22" height="3" fill="#7A4A18"/>
  <rect x="70" y="111" width="5"  height="4" fill="#E04848"/>
  <rect x="77" y="111" width="5"  height="4" fill="#E0C030"/>

  <!-- FOUNDATION + GROUND -->
  <rect x="0" y="120" width="96" height="4" fill="#9A7840"/>
  <rect x="0" y="124" width="96" height="4" fill="#9EC85A"/>
</svg>
