  <rect x="0"  y="68" width="96" height="2"  fill="#9A4C18"/>
  <rect x="0"  y="76" width="96" height="2"  fill="#9A4C18"/>
  <!-- tile offset pattern (даёт глубину) -->
  <rect x="0"  y="56" width="12" height="4"  fill="#B05A20"/>
  <rect x="16" y="56" width="12" height="4"  fill="#B05A20"/>
  <rect x="32" y="56" width="12" height="4"  fill="#B05A20"/>
  <rect x="48" y="56" width="12" height="4"  fill="#B05A20"/>
  <rect x="64" y="56" width="12" height="4"  fill="#B05A20"/>
  <rect x="80" y="56" width="12" height="4"  fill="#B05A20"/>
  <rect x="8"  y="64" width="12" height="4"  fill="#B05A20"/>
  <rect x="24" y="64" width="12" height="4"  fill="#B05A20"/>
  <rect x="40" y="64" width="12" height="4"  fill="#B05A20"/>
  <rect x="56" y="64" width="12" height="4"  fill="#B05A20"/>
  <rect x="72" y="64" width="12" height="4"  fill="#B05A20"/>
  <rect x="0"  y="72" width="12" height="4"  fill="#B05A20"/>
  <rect x="16" y="72" width="12" height="4"  fill="#B05A20"/>
  <rect x="32" y="72" width="12" height="4"  fill="#B05A20"/>
  <rect x="48" y="72" width="12" height="4"  fill="#B05A20"/>
  <rect x="64" y="72" width="12" height="4"  fill="#B05A20"/>
  <rect x="80" y="72" width="12" height="4"  fill="#B05A20"/>
  <!-- eave -->
  <rect x="0"  y="88" width="96" height="5"  fill="#D07030"/>
  <!-- eave shadow -->
  <rect x="0"  y="93" width="96" height="7"  fill="#1A0C04"/>

  <!-- ВЫВЕСКА над дверью -->
  <rect x="28" y="95" width="40" height="8"  fill="#8A5020"/>
  <rect x="30" y="96" width="36" height="6"  fill="#AA6830"/>
  <rect x="33" y="98" width="30" height="2"  fill="#C88040"/>

  <!-- СТЕНЫ — светлые, тёплые -->
  <rect x="0"  y="100" width="96" height="20" fill="#EEE0C0"/>
  <!-- Левое окно — БОЛЬШОЕ, светится печью -->
  <rect x="4"  y="101" width="30" height="16" fill="#B04808"/>
  <rect x="5"  y="102" width="28" height="14" fill="#E06018"/>
  <rect x="6"  y="103" width="26" height="12" fill="#FFB030"/>
  <rect x="8"  y="105" width="8"  height="7"  fill="#FFE060"/>
  <rect x="18" y="105" width="8"  height="7"  fill="#FFCC40"/>
