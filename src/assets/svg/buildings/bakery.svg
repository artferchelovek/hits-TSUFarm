  <rect x="38" y="103" width="20" height="17" fill="#7A4A18"/>
  <rect x="39" y="104" width="8"  height="11" fill="#9A6030"/>
  <rect x="49" y="104" width="8"  height="11" fill="#9A6030"/>
  <rect x="44" y="110" width="4"  height="3"  fill="#C08040"/>
