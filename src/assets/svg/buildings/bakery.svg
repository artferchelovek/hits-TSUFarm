  <rect x="64" y="0"  width="10" height="3"  fill="#DDD8D0"/>
  <rect x="65" y="0"  width="8"  height="2"  fill="#EEE8E0"/>

  <!-- КРЫША — тёплая черепица, глиняный цвет -->
  <!-- back edge -->
  <rect x="0"  y="32" width="96" height="8"  fill="#7A3A10"/>
  <!-- ridge lit -->
  <rect x="0"  y="40" width="96" height="5"  fill="#E08040"/>
