  <rect x="62" y="102" width="30" height="13" fill="#C8E8F8"/>
  <rect x="62" y="102" width="30" height="2"  fill="#7A4818"/>
  <rect x="76" y="102" width="2"  height="13" fill="#7A4818"/>
