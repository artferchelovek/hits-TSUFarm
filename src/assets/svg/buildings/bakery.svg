  <rect x="64" y="105" width="10" height="7"  fill="#D49050"/>
  <rect x="65" y="104" width="8"  height="3"  fill="#C07030"/>
  <rect x="79" y="105" width="10" height="7"  fill="#D08040"/>
  <rect x="80" y="104" width="8"  height="3"  fill="#B86020"/>

  <!-- FOUNDATION + GROUND -->
  <rect x="0"  y="120" width="96" height="4"  fill="#9A7840"/>
  <rect x="0"  y="124" width="96" height="4"  fill="#9EC85A"/>
