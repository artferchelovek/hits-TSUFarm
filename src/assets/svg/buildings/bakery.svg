  <rect x="4"  y="101" width="30" height="2"  fill="#7A4818"/>
  <rect x="4"  y="115" width="30" height="2"  fill="#7A4818"/>
  <rect x="18" y="101" width="2"  height="16" fill="#7A4818"/>
