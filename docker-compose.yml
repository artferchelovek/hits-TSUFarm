services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tsufarm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tsufarm_pass}
      POSTGRES_DB: tsufarm
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tsufarm"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgres://tsufarm:${POSTGRES_PASSWORD:-tsufarm_pass}@db:5432/tsufarm
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORT: 3001
      CORS_ORIGIN: https://lilv2dim.ru
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
